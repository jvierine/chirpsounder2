[config]
# UNIS Longyearbyen continuous-wave ionosonde schedule. This file is copied
# from /home/j/src/ionosonde/config/unis_lyr_cw.ini so receiver quick-look
# products can reproduce the transmitter's frequency timing.
instrument_name="UNIS Longyearbyen Ionosonde"
short_name="unis_lyr"
n_range_gates=1000
max_plot_range=600.0
max_plot_dB=30.0
station_id=4
lat=78.15385
lon=16.05709
require_gps=true
save_raw_voltage=false
min_gps_lock_time=0
gps_holdover_time=1800.0
rx_channel="cha"
sample_rate=1000000
dec=10
data_dir="/dev/shm"
range_shift=5
code_len=10000
code_type=["prn"]
pulse_length=[-1]
ipp=[1000]
bw=[100e3]

# Center frequency (MHz), code number. Each row lasts frequency_duration.
freqs=[[2.25,0],
       [2.4,0],
       [2.56,0],
       [2.7,0],
       [3.205,0],
       [3.35,0],
       [4.488,0],
       [4.9,0],
       [5.055,0],
       [5.85,0],
       [6.0,0],
       [6.15,0],
       [6.95,0],
       [7.25,0],
       [7.4,0],
       [7.55,0],
       [7.7,0],
       [8.145,0],
       [9.45,0],
       [11.650,0],
       [13.620,0],
       [15.15,0],
       [15.75,0],
       [17.53,0],
       [18.95,0],
       [21.5,0],
       [25.06,0],
       [21.5,0],
       [18.95,0],
       [17.53,0]]

transmit_amplitude=0.8
frequency_duration=2
spectral_whitening=false
antenna_select_freq=3.4
tx_addr="192.168.10.2"
rx_addr="192.168.10.2"
tx_subdev="A:A"
rx_subdev="A:A"
tx_subdev_refl_pwr="A:A"
ionogram_path="/data/ionograms"
ionogram_subpath="%Y/%m/%d/%H"
ionogram_dirname="%%Y/%%m/%%d/%%H"
reflected_power_cal_dB=17.6
