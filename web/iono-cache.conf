# Old open dashboards used a new refresh timestamp for every image request.
# Redirect those URLs to a stable resource so their browser can revalidate it.
<Directory "/var/www/html/iono">
    RewriteEngine On
    RewriteCond %{QUERY_STRING} (^|&)refresh=[0-9]+(&|$)
    RewriteRule ^([^/]+\.png)$ /iono/$1 [R=302,QSD,L]
</Directory>

<LocationMatch "^/iono/[^/]+\.png$">
    Header set Cache-Control "public, no-cache"
    Header set Cache-Control "public, max-age=31536000, immutable" "expr=%{QUERY_STRING} =~ m#^v=[0-9]+-[0-9]+$#"
</LocationMatch>
