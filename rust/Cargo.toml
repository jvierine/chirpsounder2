[workspace]
members = ["crates/iono-core", "crates/iono-receiver", "crates/iono-render", "crates/iono-plots", "crates/iono-browser"]
resolver = "2"
[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hdf5 = { package = "hdf5-metno", version = "0.12" }
num-complex = "0.4"
rustfft = "6.4"
chrono = { version = "0.4", features = ["serde"] }
[profile.release]
lto = "thin"
codegen-units = 1
